name: Update and deploy portfolio

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Keep scheduled workflow active
        if: github.event_name == 'schedule'
        continue-on-error: true
        shell: bash
        run: |
          LAST_COMMIT_TS="$(git log -1 --format=%ct)"
          NOW_TS="$(date +%s)"
          MAX_AGE="$((30 * 24 * 60 * 60))"

          if [ "$((NOW_TS - LAST_COMMIT_TS))" -ge "$MAX_AGE" ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive
            git commit -m "chore: keep portfolio schedules active [skip ci]"
            git push
          else
            echo "Keepalive nem szükséges."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync pinned GitHub repositories
        env:
          PORTFOLIO_GITHUB_USERNAME: uhuabagoly
          PORTFOLIO_GITHUB_TOKEN: ${{ secrets.PORTFOLIO_GITHUB_TOKEN || github.token }}
        run: node ./scripts/sync-pinned-repositories.mjs

      - name: Persist pinned snapshot for Go Live
        shell: bash
        run: |
          if git diff --quiet -- public/data/pinned.json; then
            echo "Pinned lista nem változott."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/pinned.json
            git commit -m "chore: sync pinned repositories [skip ci]"
            git push
          fi

      # Keep the original static fallback generation untouched.
      - name: Sync GitHub project data
        env:
          PORTFOLIO_GITHUB_USERNAME: uhuabagoly
          PORTFOLIO_GITHUB_TOKEN: ${{ secrets.PORTFOLIO_GITHUB_TOKEN || github.token }}
        run: node ./scripts/sync-github-projects.mjs

      - name: Render static pages from synced data
        run: node ./scripts/render-static.mjs

      - name: Validate pinned TOP data
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('./public/data/pinned.json', 'utf8'));
          if (!Array.isArray(p.repositories)) throw new Error('pinned.json repositories missing');
          const validSources = new Set(['github-graphql-pinnedItems', 'github-profile-html']);
          if (!validSources.has(p.source)) throw new Error(`pinned.json invalid source: ${p.source}`);
          if (Number(p.count) !== p.repositories.length) throw new Error('pinned.json count mismatch');
          console.log(`TOP data ready: ${p.repositories.length} repository pin(s)`);
          p.repositories.forEach((name, i) => console.log(`${i + 1}. ${name}`));
          NODE

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
